[package]
name = "mandelbrot"
version = "0.1.0"
edition = "2024"

[dependencies]
winit = "0.30.13"
raw-window-handle = "0.6.2"
png = "0.17"

# Everything Apple-specific lives behind this target gate and is only used
# from `src/render/metal/`.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-foundation = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-metal = "0.3.2"
objc2-quartz-core = "0.3.2"
objc2-app-kit = "0.3.2"

# Every other platform renders through wgpu (Vulkan on Linux), used only
# from `src/render/wgpu/`.
[target.'cfg(not(target_os = "macos"))'.dependencies]
wgpu = "30.0.1"
pollster = "1.0.1"

[profile.release]
debug = 1
